<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Secure Share</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="max-width: 500px; margin-top: 100px;">
        <h1>🔐 Secure Shared Password</h1>
        <p class="subtitle">Someone shared a credential with you securely.</p>

        <!-- Step 1: Ask for their email to find their Private Key -->
        <div id="auth-step">
            <p>Please enter the email address this was shared with:</p>
            <input type="email" id="receiver-email" placeholder="Your Email Address" required>
            <button id="decrypt-btn" style="background: #00d4ff; color: #fff; margin-top: 10px;">Decrypt Password</button>
            <div id="error-msg" class="error" style="margin-top: 15px;"></div>
        </div>

        <!-- Step 2: Show the decrypted password -->
        <div id="result-step" style="display: none; margin-top: 20px; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 10px;">
            <h3 style="color: #00d4ff; margin-bottom: 15px;">✅ Decrypted Successfully!</h3>
            <p><strong>Site:</strong> <span id="res-site"></span></p>
            <p><strong>Username:</strong> <span id="res-username"></span></p>
            <p><strong>Password:</strong> <span id="res-password" style="font-family: monospace; color: #ff4444;"></span></p>
        </div>
    </div>

    <!-- Include the logic script -->
    <script src="share.js"></script>
</body>
</html>
